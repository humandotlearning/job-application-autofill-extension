<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Autofill Demo Job Form</title>
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui; }
    form { display: grid; gap: 14px; }
    label, legend { font-weight: 650; }
    input, select, textarea { width: 100%; padding: 9px; font: inherit; }
    fieldset label { display: inline-flex; width: auto; gap: 6px; margin-right: 18px; font-weight: 400; }
    fieldset input { width: auto; }
    button { padding: 10px; }
    [hidden] { display: none; }
    .note { color: #5d6670; }
  </style>
</head>
<body>
  <h1>Autofill two-step demo</h1>
  <p class="note">Fill this form once, confirm submission, then reload and run it again to reuse the learned answers.</p>

  <form id="profile-step">
    <h2>Step 1 · Profile</h2>
    <label>Full Name <input name="fullName" autocomplete="name" required></label>
    <label>Email Address <input type="email" name="email" autocomplete="email" required></label>
    <label>Country
      <select name="country" required>
        <option value="">Choose one</option>
        <option value="IN">India</option>
        <option value="US">United States</option>
      </select>
    </label>
    <button type="button" id="continue-profile">Continue</button>
  </form>

  <form id="questions-step" hidden>
    <h2>Step 2 · Questions</h2>
    <label>Notice period <input name="noticePeriod" required></label>
    <fieldset>
      <legend>Are you willing to relocate?</legend>
      <label><input type="radio" name="relocate" value="Yes" required> Yes</label>
      <label><input type="radio" name="relocate" value="No" required> No</label>
    </fieldset>
    <label>Why do you want this role? <textarea name="motivation" required></textarea></label>
    <label>Resume <input type="file" name="resume"></label>
    <button type="submit">Submit application</button>
  </form>

  <p id="complete" hidden>Submitted. Reload the page to test second-run autofill.</p>
  <script>
    const profile = document.querySelector('#profile-step');
    const questions = document.querySelector('#questions-step');
    profile.addEventListener('submit', (event) => event.preventDefault());
    profile.querySelector('#continue-profile').addEventListener('click', () => {
      profile.hidden = true;
      questions.hidden = false;
      questions.querySelector('input, textarea, select')?.focus();
    });
    questions.addEventListener('submit', (event) => {
      event.preventDefault();
      questions.hidden = true;
      document.querySelector('#complete').hidden = false;
    });
  </script>
</body>
</html>
