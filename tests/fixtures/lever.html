<!doctype html><title>Lever application fixture</title>
<form aria-label="Subscribe to job alerts"><label>Email<input id="subscribe-email" type="email"></label><button>Subscribe</button></form>
<main><form id="application-form" aria-label="Job application">
  <label>Full name<input name="name" autocomplete="name" required></label>
  <label>Email<input name="email" type="email" autocomplete="email" required></label>
  <label>GitHub URL<input name="urls[GitHub]" type="url" autocomplete="url"></label>
  <label>LinkedIn URL<input name="urls[LinkedIn]" type="url" autocomplete="url"></label>
  <label>Skills<select id="skills" multiple><option>JavaScript</option><option>Python</option><option>Go</option></select></label>
  <button type="submit">Submit application</button>
</form></main>
