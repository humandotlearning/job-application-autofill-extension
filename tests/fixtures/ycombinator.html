<!doctype html>
<html><head><title>Lead AI Engineer at Vahan | Y Combinator</title></head><body>
  <main aria-hidden="true" inert>
    <form aria-label="Job alerts"><input type="email" placeholder="Email"><button>Subscribe</button></form>
  </main>
  <div id="headlessui-portal-root"><div role="dialog" aria-modal="true">
    <h3>Apply to Vahan</h3>
    <form action="#">
      <input id="first_name" name="first_name" placeholder="First Name *">
      <input id="last_name" name="last_name" placeholder="Last Name *">
      <input id="email" name="email" type="email" placeholder="Email Address *">
      <input id="linkedin_url" name="linkedin_url" placeholder="Linkedin URL *">
      <input aria-label="Phone country" role="combobox" aria-haspopup="listbox">
      <input type="tel" placeholder="Phone Number">
      <input id="city_current" name="city_current" role="combobox" placeholder="Current location*">
      <label>Upload Resume *<input type="file" name="resume"></label>
      <textarea name="message" placeholder="What interests you about Vahan?"></textarea>
      <iframe title="Widget containing checkbox for hCaptcha security challenge"></iframe>
      <textarea name="h-captcha-response" style="display:none"></textarea>
      <button type="submit"><span>Send Message</span></button>
      <button type="button">Close</button>
    </form>
  </div></div>
</body></html>
