<!doctype html><title>Workday application fixture</title>
<main><form aria-label="Job application">
  <div data-automation-id="textInput"><label for="givenName">First name</label><input id="givenName" autocomplete="given-name" required></div>
  <fieldset id="job1" data-automation-id="workExperience"><legend>Employment</legend><label>Company<input name="company" value="Analytical Engines"></label><label>Job title<input name="jobTitle" value="Engineer"></label></fieldset>
  <fieldset id="job2" data-automation-id="workExperience"><legend>Employment</legend><label>Company<input name="company" value="Ada Computing"></label><label>Job title<input name="jobTitle" value="Lead"></label></fieldset>
  <fieldset><legend>Have you previously worked here?</legend><label><input type="radio" name="previous" value="Yes">Yes</label><label><input type="radio" name="previous" value="No" checked>No</label></fieldset>
  <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
</form></main>
